name: Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create . --platforms=android --org=com.schoolmanagement

      - name: Fix Flutter dot-shorthands
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/main.dart")

          if not path.exists():
              raise SystemExit("ERROR: lib/main.dart was not found.")

          text = path.read_text()

          text = text.replace(
              "colorScheme: .fromSeed(",
              "colorScheme: ColorScheme.fromSeed("
          )

          text = text.replace(
              "mainAxisAlignment: .center",
              "mainAxisAlignment: MainAxisAlignment.center"
          )

          path.write_text(text)

          print("Dot-shorthand fixes applied successfully.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://yeqpkotyeqvajxanlzpj.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: school-management-apk
          path: build/app/outputs/flutter-apk/app-release.apk
